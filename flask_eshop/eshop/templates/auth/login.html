{% extends "base.html" %}

{% block title %}{{ _('Login') }} - eShop{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon"><i class="fas fa-user"></i></span>
            <h1>{{ _('Welcome back') }}</h1>
            <p>{{ _('Log in to check out and track your orders.') }}</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" data-auth-form>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- Where to go after logging in (e.g. back to checkout) -->
            <input type="hidden" name="next" value="{{ request.values.get('next', '') }}">

            <div class="form-group">
                <label for="email">{{ _('Email') }}</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com"
                           value="{{ request.form.get('email', '') }}" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">{{ _('Password') }}</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="{{ _('Your password') }}" required>
                    <button type="button" class="password-toggle" data-password-toggle="password" aria-label="{{ _('Show password') }}" aria-pressed="false">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">{{ _('Log in') }}</button>
        </form>

        <p class="auth-switch">{{ _('Don\'t have an account?') }} <a href="{{ url_for('auth.register') }}">{{ _('Create one') }}</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
