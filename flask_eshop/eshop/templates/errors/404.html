{% extends "base.html" %}

{% block title %}{{ _('Page not found') }} - eShop{% endblock %}

{% block content %}
<div class="error-page">
    <span class="error-code">404</span>
    <h1>{{ _('Page not found') }}</h1>
    <p>{{ _('The page you\'re looking for doesn\'t exist or has been moved.') }}</p>
    <div class="error-actions">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> {{ _('Go home') }}
        </a>
        <button type="button" class="btn btn-outline" data-open-categories>
            <i class="fas fa-th-large"></i> {{ _('Browse categories') }}
        </button>
    </div>
</div>
{% endblock %}
