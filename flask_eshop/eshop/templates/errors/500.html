{% extends "base.html" %}

{% block title %}{{ _('Server error') }} - eShop{% endblock %}

{% block content %}
<div class="error-page">
    <span class="error-code">500</span>
    <h1>{{ _('Something went wrong') }}</h1>
    <p>{{ _('We\'re experiencing some technical difficulties. Please try again later.') }}</p>
    <div class="error-actions">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> {{ _('Go home') }}
        </a>
        <button type="button" onclick="window.location.reload()" class="btn btn-outline">
            <i class="fas fa-redo"></i> {{ _('Try again') }}
        </button>
    </div>
</div>
{% endblock %}
