<!-- Modern Header -->
<header class="main-header">
    <div class="header-content">
        <div class="logo">
            <a href="{{ url_for('main.home') }}">
                <i class="fas fa-store"></i>
                <span>eShop</span>
            </a>
        </div>
        
        <!-- Search Bar with Integrated Categories Button -->
        <div class="header-search-container">
            <form method="get" action="{{ url_for('main.home') }}" class="header-search-form">
                <div class="header-search-group">
                    <!-- Categories Button inside search bar -->
                    <button type="button" class="categories-search-btn" id="categoriesToggle">
                        <i class="fas fa-list"></i>
                        <span>Categories</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    
                    <input type="text" name="q" placeholder="Search products..." class="header-search-input" value="{{ request.args.get('q', '') }}">
                    <button type="submit" class="header-search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </form>
        </div>
        
        <nav class="main-nav">
            <!-- Language Selector -->
            <div class="language-selector">
                <button class="language-btn">
                    <i class="fas fa-globe"></i>
                    <span>EN</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="language-menu">
                    <button class="language-option" data-lang="en">English</button>
                    <button class="language-option" data-lang="el">Ελληνικά</button>
                    <button class="language-option" data-lang="de">Deutsch</button>
                </div>
            </div>
            
            <!-- Cart -->
            
            <a href="{{ url_for('cart.view_cart') }}" class="nav-link cart-link">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" style="{% if not session.cart or session.cart.values() | sum == 0 %}display: none;{% else %}display: flex;{% endif %}">
                    {% if session.cart %}
                        {{ session.cart.values() | sum }}
                    {% else %}
                        0
                    {% endif %}
                </span>
            </a>
            
            <!-- User Menu -->
            {% if 'user_id' in session %}
            <div class="user-dropdown">
                <button class="user-menu-btn" id="userMenuToggle">
                    <i class="fas fa-user-circle"></i>
                    <span>{{ session['username'] }}</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="user-dropdown-menu" id="userDropdown">
                    {% if session['role'] != 'admin' %}
                    <a href="{{ url_for('orders.user_orders') }}" class="dropdown-item">
                        <i class="fas fa-receipt"></i>
                        My Orders
                    </a>
                    {% endif %}
                    {% if session['role'] == 'admin' %}
                    <a href="{{ url_for('admin.products') }}" class="dropdown-item">
                        <i class="fas fa-cog"></i>
                        Admin Panel
                    </a>
                    {% endif %}
                    <div class="dropdown-divider"></div>
                    <a href="{{ url_for('auth.logout') }}" class="dropdown-item">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </a>
                </div>
            </div>
            {% else %}
            <div class="auth-links">
                <a href="{{ url_for('auth.login') }}" class="nav-link">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login</span>
                </a>
                <a href="{{ url_for('auth.register') }}" class="nav-link register-btn">
                    <i class="fas fa-user-plus"></i>
                    <span>Register</span>
                </a>
            </div>
            {% endif %}
        </nav>
    </div>
</header>

<!-- Categories Sidebar - REMOVED CLOSE BUTTON FROM HEADER -->
<div class="categories-sidebar" id="categoriesSidebar">
    <div class="sidebar-header">
        <h3>All Categories</h3>
        <button class="close-sidebar" id="closeCategories">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="sidebar-content">
        <div class="categories-list" id="categoriesList">
            <!-- Categories will be populated by JavaScript - NO "All Categories" item -->
        </div>
    </div>
</div>

<!-- Overlay for sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
