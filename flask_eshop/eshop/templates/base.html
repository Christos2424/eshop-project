<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}eShop - Modern Online Shopping{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/products.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/product-detail.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    {% include 'partials/_header.html' %}

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Flash Messages -->
            {% include 'partials/_flash.html' %}

            <!-- Page Content -->
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Modern Footer -->
    {% include 'partials/_footer.html' %}

    <!-- Include categories data for JavaScript -->
    <script id="categories-data" type="application/json">{{ global_categories | tojson }}</script>
    
    <!-- URL configuration for JavaScript -->
    <script>
        window.APP_URLS = {
            home: "{{ url_for('main.home') }}",
            add_to_cart: "{{ url_for('cart.add_to_cart') }}",
            view_cart: "{{ url_for('cart.view_cart') }}",
            user_orders: "{{ url_for('orders.user_orders') }}",
            admin_products: "{{ url_for('admin.products') }}",
            login: "{{ url_for('auth.login') }}",
            register: "{{ url_for('auth.register') }}",
            logout: "{{ url_for('auth.logout') }}",
            product_detail: "{{ url_for('main.product_detail', product_id=0) }}".replace('/0', '')
        };
    </script>
    
    <!-- Base JavaScript (loaded on all pages) -->
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    
    <!-- Page-specific JavaScript -->
    {% block scripts %}{% endblock %}
    
</body>
</html>
